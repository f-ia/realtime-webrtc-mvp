<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Speaking Practice </title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/public/styles.css">
</head>

<body>
  <div class="container">

    <header>
      <div class="brand">
        <img src="/public/wizard-logo.png" alt="Wizard by Pearson" class="brand-logo" width="200" height="60">
      </div>
      <h1>Speaking Practice</h1>
    </header>

    <div class="progress-section">
      <div class="progress-info">
        <span id="exerciseNumber"> Exercício 0 de 0 </span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-bar-container">
        <div id="progressBar" class="progress-bar"></div>
      </div>
    </div>

    <div class="exercise-card">
      <div class="exercise-header">
        <span class="tag" id="difficulty">—</span>
        <button id="playTarget" class="btn-play" title="Ouvir pronúncia correta" type="button"> 🔊 </button>
      </div>

      <div class="phrase-text-box">
        <p id="phraseText"> Clique em START para carregar as frases </p>
      </div>

      <div class="phrase-translation">
        <p id="phraseTranslation">—</p>
      </div>

      <div class="status-box" id="statusBox">
        <span id="status" class="status-text ready" role="status" aria-live="polite">Pronto</span>
      </div>

      <div id="resultCard" class="result-card hidden" role="status" aria-live="polite">
        <div class="result-row">
          <div id="resultIcon" class="result-icon">✅</div>
          <div class="result-body">
            <div id="resultTitle" class="result-title">Título</div>
            <div id="resultMsg" class="result-msg">Mensagem</div>
            <div id="resultMeta" class="result-meta">Meta</div>
          </div>
        </div>
      </div>

      <!-- BOTÕES (lado a lado) -->
      <div class="button-group" role="group" aria-label="Controles de gravação">
        <button id="start" class="btn btn-primary" type="button">🎙️ START</button>

        <!-- Só aparece no SHOWING_RESULT -->
        <button id="retry" class="btn btn-secondary hidden" type="button">🔁 RETRY</button>
        <button id="next" class="btn btn-primary hidden" type="button">📝 PRÓXIMO</button>

        <!-- Só aparece gravando -->
        <button id="stop" class="btn btn-danger hidden" type="button">⏹️ STOP</button>
      </div>
    </div>

    <div class="log-box hidden" id="logBox" data-dev-only>
      <h3>Logs</h3>
      <div id="log"></div>
    </div>

  </div>

  <script src="/public/app.js"></script>
</body>
</html>
